name: Enviar videos a Buffer

on:
  schedule:
    - cron: "37 * * * *"   # cada hora (minuto 37). Solo envía lo aprobado que se publica en las próximas 72 h
  workflow_dispatch:
    inputs:
      diagnostico:
        description: "Listar organizaciones, canales y tipos de post de la cuenta de Buffer de Skala (no muestra la clave)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: buffer
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Diagnóstico
        if: ${{ inputs.diagnostico }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node scripts/enviar_a_buffer.mjs --diagnostico
      - name: Enviar a Buffer lo aprobado
        if: ${{ !inputs.diagnostico }}
        env:
          # Seguro por defecto: solo publica si la variable de repositorio MODO vale "real".
          MODO: ${{ vars.MODO }}
          CANALES: ${{ vars.CANALES }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node scripts/enviar_a_buffer.mjs
      - name: Guardar estado de la cola
        if: ${{ always() && !inputs.diagnostico }}
        run: |
          if [ -n "$(git status --porcelain cola.json)" ]; then
            git config user.name "skala-bot"
            git config user.email "skala-bot@users.noreply.github.com"
            git add cola.json
            git commit -m "Actualizar estado de la cola"
            git pull --rebase origin main
            git push
          fi
